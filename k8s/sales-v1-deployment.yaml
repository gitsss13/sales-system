apiVersion: apps/v1
kind: Deployment
metadata:
  name: sales-system-v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sales-system-v1
  template:
    metadata:
      labels:
        app: sales-system-v1
    spec:
      containers:
        - name: sales-system-v1
          image: gitsss13/sales-system:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: sales-system-v1
spec:
  type: NodePort
  selector:
    app: sales-system-v1
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30081
