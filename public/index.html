<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sales System v1</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="container">
      <header class="header">
        <h1>Sales System - v1</h1>
        <p>Record sales, track inventory, and calculate revenue.</p>
      </header>

      <div id="alertBox" class="alert" style="display: none;"></div>

      <section class="panel">
        <h2>Add Sale</h2>
        <form id="saleForm">
          <div class="form-grid">
            <label>
              Item
              <input type="text" name="item" placeholder="e.g. Laptop" required />
            </label>
            <label>
              Quantity
              <input type="number" name="quantity" min="1" step="1" required />
            </label>
            <label>
              Price
              <input type="number" name="price" min="0.01" step="0.01" required />
            </label>
          </div>
          <button type="submit">Record Sale</button>
        </form>
      </section>

      <section class="summary-grid">
        <div class="summary-card">
          <span class="label">Total Sales</span>
          <strong id="totalSales">0</strong>
        </div>
        <div class="summary-card highlight">
          <span class="label">Revenue</span>
          <strong id="totalRevenue">$0.00</strong>
        </div>
      </section>

      <section class="panel">
        <h2>Sales View</h2>
        <table>
          <thead>
            <tr>
              <th>Item</th>
              <th>Qty</th>
              <th>Unit Price</th>
              <th>Line Total</th>
              <th>Date</th>
            </tr>
          </thead>
          <tbody id="salesTableBody"></tbody>
        </table>
      </section>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
